<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schulden-Übersicht</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f26; --muted:#6b7280; --accent:#2563eb; --red:#dc2626; --green:#16a34a; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111318; --card:#1b1e26; --text:#e8eaf0; --muted:#9aa1b0; --accent:#60a5fa; --red:#f87171; --green:#4ade80; --border:#2b303b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:16px; }
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; text-align:center; }
  .summary small { color:var(--muted); display:block; }
  .summary b { font-size:1.15rem; }
  .red { color:var(--red); } .green { color:var(--green); }
  .form { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .form .full { grid-column:1/-1; }
  input, select, button { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--text); width:100%; }
  button { cursor:pointer; background:var(--accent); color:#fff; border:none; font-weight:600; }
  button.ghost { background:transparent; color:var(--muted); border:1px solid var(--border); width:auto; padding:6px 10px; font-weight:400; }
  .debt { border-top:1px solid var(--border); padding:12px 0; }
  .debt:first-child { border-top:none; }
  .row { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .name { font-weight:600; } .meta { color:var(--muted); font-size:.85rem; }
  .bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:8px 0; }
  .bar > i { display:block; height:100%; background:var(--green); }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .actions input { width:110px; padding:6px 8px; }
  .done { opacity:.55; }
  .empty { color:var(--muted); text-align:center; padding:16px 0; }
  .tools { display:flex; gap:8px; justify-content:flex-end; }
</style>
</head>
<body>
<main>
  <h1>💸 Meine Schulden</h1>

  <section class="card summary">
    <div><small>Gesamt offen</small><b id="sOpen" class="red">0,00 €</b></div>
    <div><small>Schon getilgt</small><b id="sPaid" class="green">0,00 €</b></div>
    <div><small>Monatsrate</small><b id="sMonthly">0,00 €</b></div>
  </section>

  <section class="card">
    <div id="form" class="form">
      <input class="full" id="name" placeholder="Gläubiger / Bezeichnung (z. B. Kreditkarte)" required>
      <input id="total" type="number" step="0.01" min="0" placeholder="Gesamtbetrag €" required>
      <input id="monthly" type="number" step="0.01" min="0" placeholder="Monatsrate € (optional)">
      <input id="due" type="date" title="Fällig am">
      <input id="rate" type="number" step="0.01" min="0" placeholder="Zinssatz % (optional)">
      <button class="full" type="button" id="add">Schuld hinzufügen</button>
      <div class="full meta" id="msg"></div>
    </div>
  </section>

  <section class="card">
    <div class="row" style="margin-bottom:8px">
      <select id="sort" style="width:auto">
        <option value="open">Sortiert: höchster Rest</option>
        <option value="due">Sortiert: Fälligkeit</option>
        <option value="name">Sortiert: Name</option>
      </select>
      <div class="tools">
        <button class="ghost" id="export">Export</button>
        <button class="ghost" id="import">Import</button>
      </div>
    </div>
    <div id="list"></div>
  </section>
</main>

<script>
const KEY = "schulden-v1";
const eur = n => new Intl.NumberFormat("de-DE", { style:"currency", currency:"EUR" }).format(n || 0);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

let debts = [];
try { debts = JSON.parse(localStorage.getItem(KEY)) || []; } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(debts)); } catch {} render(); };

function add() {
  const name = $("name").value.trim(), total = parseFloat($("total").value.replace(",", "."));
  if (!name || !(total > 0)) { $("msg").textContent = "Bitte Bezeichnung und Gesamtbetrag eintragen."; return; }
  $("msg").textContent = "";
  debts.push({
    id: Date.now().toString(36),
    name,
    total,
    paid: 0,
    monthly: parseFloat($("monthly").value) || 0,
    rate: parseFloat($("rate").value) || 0,
    due: $("due").value || ""
  });
  ["name","total","monthly","due","rate"].forEach(i => $(i).value = "");
  save();
}
$("add").addEventListener("click", add);
document.querySelectorAll("#form input").forEach(i => i.addEventListener("keydown", e => { if (e.key === "Enter") add(); }));

function pay(id, sign) {
  const d = debts.find(x => x.id === id);
  const inp = document.getElementById("amt-" + id);
  const v = parseFloat(inp.value) || d.monthly;
  if (!v) return;
  d.paid = Math.min(d.total, Math.max(0, d.paid + sign * v));
  save();
}
let delArm = null;
function del(id) {
  if (delArm !== id) { delArm = id; render(); return; }
  delArm = null; debts = debts.filter(x => x.id !== id); save();
}

function render() {
  const rest = d => d.total - d.paid;
  const sort = $("sort").value;
  const list = [...debts].sort((a, b) =>
    sort === "name" ? a.name.localeCompare(b.name) :
    sort === "due" ? (a.due || "9999").localeCompare(b.due || "9999") :
    rest(b) - rest(a));

  $("sOpen").textContent = eur(debts.reduce((s, d) => s + rest(d), 0));
  $("sPaid").textContent = eur(debts.reduce((s, d) => s + d.paid, 0));
  $("sMonthly").textContent = eur(debts.filter(d => rest(d) > 0).reduce((s, d) => s + d.monthly, 0));

  $("list").innerHTML = list.length ? list.map(d => {
    const r = rest(d), pct = d.total ? Math.round(d.paid / d.total * 100) : 100;
    const months = d.monthly && r > 0 ? Math.ceil(r / d.monthly) : null;
    const overdue = d.due && r > 0 && d.due < new Date().toISOString().slice(0, 10);
    return `<div class="debt ${r <= 0 ? "done" : ""}">
      <div class="row"><span class="name">${esc(d.name)}${r <= 0 ? " ✅" : ""}</span><b class="${r > 0 ? "red" : "green"}">${eur(r)}</b></div>
      <div class="meta">von ${eur(d.total)} · ${pct}% getilgt
        ${d.rate ? " · " + d.rate + "% Zinsen" : ""}
        ${d.due ? ` · fällig ${new Date(d.due).toLocaleDateString("de-DE")}${overdue ? " ⚠️ überfällig" : ""}` : ""}
        ${months ? ` · ca. ${months} Monate bei ${eur(d.monthly)}/Monat` : ""}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="actions">
        <input id="amt-${d.id}" type="number" step="0.01" min="0" placeholder="${d.monthly ? d.monthly : "Betrag"}">
        <button class="ghost" onclick="pay('${d.id}',1)">+ Zahlung</button>
        <button class="ghost" onclick="pay('${d.id}',-1)">− Korrektur</button>
        <button class="ghost" onclick="del('${d.id}')">${delArm === d.id ? "Wirklich löschen?" : "🗑"}</button>
      </div>
    </div>`;
  }).join("") : `<div class="empty">Noch keine Schulden eingetragen 🎉</div>`;
}

$("sort").addEventListener("change", render);
$("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(debts, null, 2)], { type:"application/json" }));
  a.download = "schulden.json"; a.click();
};
$("import").onclick = () => {
  const f = document.createElement("input"); f.type = "file"; f.accept = "application/json";
  f.onchange = async () => {
    try { const data = JSON.parse(await f.files[0].text()); if (Array.isArray(data)) { debts = data; save(); } } catch { $("msg").textContent = "Ungültige Datei"; }
  };
  f.click();
};
render();
</script>
</body>
</html>
